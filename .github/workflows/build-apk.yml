name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate dependency graph
        run: flutter pub deps --style=compact

      - name: Add namespace to legacy plugin
        shell: bash
        run: |
          declare -A plugin_namespaces=(
            ["auto_orientation-2.3.1"]="com.gutech.auto_orientation"
            ["flutter_displaymode-0.5.0"]="com.jrai.flutter_displaymode"
          )
          for plugin in "${!plugin_namespaces[@]}"; do
            plugin_gradle="$HOME/.pub-cache/hosted/pub.dev/$plugin/android/build.gradle"
            if [ -f "$plugin_gradle" ] && ! grep -q "namespace" "$plugin_gradle"; then
              sed -i "/android {/a\\    namespace \"${plugin_namespaces[$plugin]}\"" "$plugin_gradle"
            fi
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bocchi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK to workflow summary
        run: |
          echo "## APK berhasil dibuat" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: bocchi-release-apk" >> "$GITHUB_STEP_SUMMARY"
          echo "File: app-release.apk" >> "$GITHUB_STEP_SUMMARY"

      
